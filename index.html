<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>八東助動詞</title>

  <!-- ========= 八東国語LOBBY Cyber UI (Template) ========= -->
  <style>
    :root{
      --bg:#07080b;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.10);
      --border:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.90);
      --muted:rgba(255,255,255,.62);
      --accent:#B56CFF;       /* violet */
      --accent2:#62d6ff;      /* cyan-ish */
      --danger:#ff5c7a;
      --ok:#5cffb7;
      --radius:18px;
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --minTap:44px;
      --maxW:980px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN","Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    }

    html,body{height:100%;}
    body{
      margin:0;
      color:var(--text);
      font-family:var(--sans);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(181,108,255,.22), transparent 60%),
        radial-gradient(900px 520px at 85% 18%, rgba(98,214,255,.16), transparent 60%),
        radial-gradient(900px 520px at 60% 110%, rgba(92,255,183,.10), transparent 60%),
        linear-gradient(180deg, #06070a, #04050a 55%, #020309);
      overflow-x:hidden;
    }

    .wrap{
      max-width:var(--maxW);
      margin:0 auto;
      padding:18px 14px 28px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .brand h1{
      margin:0;
      font-size:20px;
      letter-spacing:.02em;
    }
    .brand .sub{
      color:var(--muted);
      font-size:12.5px;
      line-height:1.35;
    }

    .glass{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .kpis{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .dot{
      width:8px;height:8px;border-radius:99px;
      background:var(--accent);
      box-shadow:0 0 16px rgba(181,108,255,.55);
    }
    .dot.cyan{ background:var(--accent2); box-shadow:0 0 16px rgba(98,214,255,.45); }
    .dot.ok{ background:var(--ok); box-shadow:0 0 16px rgba(92,255,183,.35); }

    .main{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    .card{
      padding:16px 14px;
    }
    .cardHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }
    .deckMeta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color:var(--muted);
      font-size:12px;
    }
    .deckMeta code{
      font-family:var(--mono);
      font-size:12px;
      color:rgba(255,255,255,.80);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      padding:3px 6px;
      border-radius:8px;
    }

    .hintRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
    }
    .swipeHint{
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .swipeBadge{
      font-family:var(--mono);
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      color:rgba(255,255,255,.78);
    }

    .btnRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
    }
    button{
      appearance:none;
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
      border-radius:14px;
      min-height:var(--minTap);
      padding:10px 14px;
      font-weight:600;
      letter-spacing:.01em;
      cursor:pointer;
      transition: transform .06s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
      touch-action:manipulation;
    }
    button:hover{
      border-color:rgba(181,108,255,.45);
      box-shadow:0 0 0 3px rgba(181,108,255,.18), 0 18px 50px rgba(0,0,0,.25);
      background:rgba(181,108,255,.08);
    }
    button:active{ transform: translateY(1px); }

    .primaryBtn{
      background:linear-gradient(180deg, rgba(181,108,255,.22), rgba(255,255,255,.06));
      border-color:rgba(181,108,255,.55);
      box-shadow:0 0 0 2px rgba(181,108,255,.18);
    }
    .secondaryBtn{
      background:rgba(255,255,255,.05);
    }
    .ghostBtn{
      background:transparent;
      border-style:dashed;
      color:rgba(255,255,255,.75);
    }

    .bgmBtn[data-on="true"]{
      border-color:rgba(92,255,183,.55);
      background:rgba(92,255,183,.10);
      box-shadow:0 0 0 2px rgba(92,255,183,.14);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.66);
      color:rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      padding:10px 14px;
      font-size:12.5px;
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      z-index:9999;
    }
    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(-2px);
    }

    /* スワイプの誤爆（縦スクロール）対策 */
    .swipeArea{
      touch-action: pan-y;
    }

    details{
      margin-top:12px;
    }
    summary{
      cursor:pointer;
      color:rgba(255,255,255,.85);
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      user-select:none;
      list-style:none;
    }
    summary::-webkit-details-marker{ display:none; }
    .maint{
      padding:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      border-radius:14px;
      margin-top:10px;
      color:var(--muted);
      font-size:12.5px;
      line-height:1.55;
    }

    .pulse5{
      position:relative;
    }
    .pulse5::after{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:inherit;
      border:1px solid rgba(181,108,255,.50);
      animation:pulse 1.7s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes pulse{
      0%{ opacity:.15; box-shadow:0 0 0 0 rgba(181,108,255,.0); }
      50%{ opacity:.55; box-shadow:0 0 0 8px rgba(181,108,255,.10); }
      100%{ opacity:.15; box-shadow:0 0 0 0 rgba(181,108,255,.0); }
    }
  </style>
</head>

<body>
  <div class="wrap swipeArea" id="swipeRoot">
    <div class="topbar">
      <div class="brand">
        <h1>八東助動詞</h1>
        <div class="sub">八東国語LOBBY準拠 / 暗色サイバーUI / スワイプ対応 / BGM（初期OFF）</div>
      </div>

      <div class="kpis">
        <!-- 既存ロジックが更新している要素があれば、ここに同じIDで差し替えてください -->
        <div class="pill"><span class="dot"></span><span>カード枚数：</span><strong id="kpiTotal">-</strong></div>
        <div class="pill"><span class="dot cyan"></span><span>今日見た枚数：</span><strong id="kpiToday">-</strong></div>
        <div class="pill"><span class="dot ok"></span><span>デッキ：</span><strong id="kpiDeck">-</strong></div>
      </div>
    </div>

    <div class="main">
      <section class="glass card pulse5" id="uiCardPanel">
        <div class="cardHeader">
          <div class="deckMeta">
            <span>最終更新：</span><code id="kpiUpdated">-</code>
          </div>

          <!-- BGM -->
          <button class="secondaryBtn bgmBtn" id="btnBgm" data-on="false" type="button">BGM: OFF</button>
          <audio id="bgmAudio" preload="none" loop>
            <source src="./assets/bgm/study.mp3" type="audio/mpeg" />
          </audio>
        </div>

        <!-- =========================
          ここに「既存のカード表示DOM」を入れる
          例：問題/答え表示、状態表示、ロード表示など
          ========================= -->
        <div id="legacyMount">
          <!-- LEGACY UI START -->
          <!-- ✅ 助動詞リポの現行 index.html から、カード表示やボタン群のDOMを“そのまま”コピペ -->
          <!-- 例：「起動中…」「読み込み中…」等の表示、カード本文、進捗表示、デッキ情報など -->
          <!-- LEGACY UI END -->
        </div>

        <div class="hintRow">
          <div class="swipeHint" aria-label="swipe hint">
            <span class="swipeBadge">←</span><span>戻る</span>
            <span style="opacity:.45;">/</span>
            <span class="swipeBadge">→</span><span>次へ</span>
            <span style="opacity:.45;">/</span>
            <span>swipe</span>
          </div>
          <div id="uiHintRight" class="swipeHint" style="justify-content:flex-end;">
            <span style="opacity:.7;">ヒント：</span><span>初回は自動読み込み</span>
          </div>
        </div>

        <!-- =========================
          ここは“見た目のボタン”を置きたい場合に使用
          既存ボタンをここに移してもOK（id保持で）
          ========================= -->
        <div class="btnRow" id="uiBtnRow">
          <!-- UIボタンをここにまとめたい場合は、既存ボタンを移動してOK -->
          <!-- 既存ロジックが要素IDに依存しているならIDは絶対に保持 -->
        </div>
      </section>

      <details>
        <summary>メンテ用（通常は生徒は触らない）</summary>
        <div class="maint">
          <div style="margin-bottom:10px;">
            PWA / キャッシュでUIが反映されない場合：SW更新 → ハードリロード → サイトデータ削除。
          </div>
          <div>
            <!-- LEGACY MAINT START -->
            <!-- ✅ 既存の「CSVインポート/書き出し/初期化/既定デッキに戻す」等のDOMをここへ -->
            <!-- LEGACY MAINT END -->
          </div>
        </div>
      </details>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ========= UX add-on: Swipe + BGM + Hints ========= -->
  <script>
    (function(){
      const root = document.getElementById("swipeRoot");
      const toast = document.getElementById("toast");

      function showToast(msg){
        if(!toast) return;
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(()=>toast.classList.remove("show"), 1100);
      }

      // ---- BGM toggle (初期OFF) ----
      const btnBgm = document.getElementById("btnBgm");
      const audio  = document.getElementById("bgmAudio");
      if(btnBgm && audio){
        btnBgm.addEventListener("click", async ()=>{
          try{
            if(btnBgm.dataset.on === "true"){
              audio.pause();
              btnBgm.dataset.on = "false";
              btnBgm.textContent = "BGM: OFF";
              showToast("BGMを停止");
            }else{
              await audio.play(); // ユーザー操作起点
              btnBgm.dataset.on = "true";
              btnBgm.textContent = "BGM: ON";
              showToast("BGMを再生");
            }
          }catch(e){
            showToast("BGMを再生できません（端末設定/操作起点を確認）");
          }
        });
      }

      // ---- Swipe: 右=次へ / 左=戻る ----
      // 既存の「次へ」「戻る」ボタンを探してクリックする方針（ロジック非侵襲）
      function findActionButton(type){
        // type: "next" | "prev"
        const candidates = [];
        const labelsNext = ["次へ", "次", "NEXT"];
        const labelsPrev = ["戻", "前", "PREV", "BACK"];

        // 1) data-action
        document.querySelectorAll("button,[role='button'],a").forEach(el=>{
          const da = el.getAttribute("data-action");
          if(type==="next" && da==="next") candidates.push(el);
          if(type==="prev" && (da==="prev" || da==="back")) candidates.push(el);
        });

        // 2) id ありがちなパターン
        const idListNext = ["btnNext","nextBtn","next","goNext","nextCard"];
        const idListPrev = ["btnPrev","prevBtn","prev","goPrev","back","prevCard"];
        const idList = type==="next" ? idListNext : idListPrev;
        idList.forEach(id=>{
          const el = document.getElementById(id);
          if(el) candidates.push(el);
        });

        // 3) ボタンの表示テキストで推測
        const labels = type==="next" ? labelsNext : labelsPrev;
        document.querySelectorAll("button").forEach(b=>{
          const t = (b.textContent||"").trim();
          if(labels.some(w=>t.includes(w))) candidates.push(b);
        });

        return candidates[0] || null;
      }

      let sx=0, sy=0, st=0, moved=false;
      const THRESH = 46;      // px
      const VERT_GUARD = 1.2; // 縦の比率が強ければ無視

      if(root){
        root.addEventListener("touchstart",(e)=>{
          const t = e.touches[0];
          sx = t.clientX; sy = t.clientY; st = Date.now();
          moved = false;
        }, {passive:true});

        root.addEventListener("touchmove",(e)=>{
          moved = true;
        }, {passive:true});

        root.addEventListener("touchend",(e)=>{
          const t = e.changedTouches[0];
          const dx = t.clientX - sx;
          const dy = t.clientY - sy;
          const dt = Date.now() - st;

          if(!moved) return;
          if(dt > 700) return;

          // 縦スクロール優先
          if(Math.abs(dy) > Math.abs(dx) * VERT_GUARD) return;

          if(Math.abs(dx) >= THRESH){
            if(dx < 0){
              const nextBtn = findActionButton("next");
              if(nextBtn){ nextBtn.click(); showToast("次へ"); }
              else showToast("次へボタンが見つかりません");
            }else{
              const prevBtn = findActionButton("prev");
              if(prevBtn){ prevBtn.click(); showToast("前へ戻る"); }
              else showToast("戻る操作は未設定（戻るボタンを data-action='prev' で指定可）");
            }
          }
        }, {passive:true});
      }

      // 既存UIに「戻る」ボタンが無い場合の救済:
      // 「前へ戻る」を成立させたいなら、既存UI内の戻る要素に data-action="prev" を付けるだけでOK。
      // 例: <button data-action="prev">戻る</button>

    })();
  </script>

  <!-- =========================
    ここに「既存の script 一式（学習ロジック／SW登録含む）」をそのまま入れる
    ※既存JSは壊さない（そのまま末尾に置く）
    ========================= -->
  <!-- LEGACY SCRIPTS START -->
  <!-- ✅ 助動詞リポの現行 index.html から、<script>...</script> / <script src=...> を全部コピペ -->
  <!-- LEGACY SCRIPTS END -->

</body>
</html>
